name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Node syntax
        run: |
          node --check bin/jdsz-live.mjs
          node --check lib/api.mjs
          node --check lib/cdp.mjs
          node --check lib/extract.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: |
          python -m py_compile scripts/merge_workbook.py scripts/add_analysis.py scripts/validate_workbook.py
